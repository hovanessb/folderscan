plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
}

android {
    // `namespace` only controls where R/BuildConfig are generated, so it is kept in
    // sync with the Kotlin package. `applicationId` is deliberately left at its
    // historical value so installed apps upgrade in place instead of appearing twice.
    namespace 'com.leonell.android.composefolderscanner'
    compileSdk 34

    defaultConfig {
        applicationId "com.leonell.android.ComposeFolderScanner"
        // Android 10 is the oldest supported handset (see docs/hardware.md).
        minSdk 29
        targetSdk 34
        versionCode = System.getenv("CI_PIPELINE_ID") ? Integer.parseInt(System.getenv("CI_PIPELINE_ID")) : 1
        versionName = System.getenv("CI_COMMIT_SHORT_SHA") ? System.getenv("CI_COMMIT_SHORT_SHA") : "localdebug"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        ksp {
            arg('room.schemaLocation', "$projectDir/schemas".toString())
        }
    }

    signingConfigs {
        release {
            // Only wire up a release keystore when signing.properties is actually
            // present; otherwise assembleRelease fails at configuration time on any
            // machine that does not hold the signing material.
            def propFile = file("signing.properties")
            if (propFile.canRead()) {
                def properties = new Properties()
                propFile.withInputStream { properties.load(it) }
                storeFile file(properties['keystorePath'])
                storePassword properties['keystorePassword']
                keyAlias properties['keyAlias']
                keyPassword properties['keyPassword']
            }
        }
        debug {
            // Fall back to the SDK's auto-generated debug keystore when a checked-in
            // one is not available.
            def debugStore = file('debug.keystore')
            if (debugStore.canRead()) {
                storeFile debugStore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            if (file("signing.properties").canRead()) {
                signingConfig signingConfigs.release
            }
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion compose_version
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'io.coil-kt:coil-compose:2.2.2'
    implementation 'io.coil-kt:coil-svg:2.2.2'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'com.google.dagger:hilt-android:2.50'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    implementation "androidx.navigation:navigation-compose:2.7.7"
    implementation 'androidx.hilt:hilt-work:1.2.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    ksp 'androidx.hilt:hilt-compiler:1.2.0'
    ksp 'com.google.dagger:hilt-compiler:2.50'

    implementation "org.jetbrains.kotlinx:kotlinx-datetime:0.4.0"

    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    implementation "androidx.compose.ui:ui:1.6.2"
    implementation "androidx.compose.ui:ui-tooling-preview:1.6.2"
    implementation 'androidx.compose.material3:material3:1.2.0'
    implementation 'androidx.compose.material:material-icons-extended:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.compose.ui:ui-util:1.6.2'
    implementation 'com.google.accompanist:accompanist-permissions:0.34.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    androidTestImplementation 'com.google.dagger:hilt-android-testing:2.50'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.6.2"
    debugImplementation "androidx.compose.ui:ui-tooling:1.6.2"
    debugImplementation "androidx.compose.ui:ui-test-manifest:1.6.2"
}
